<div class="container">
  <div class="card glass">
    <h2>Doctor Consultation Summary</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Select Appointment</label>
        <select [(ngModel)]="selectedAppointment">
          <option [ngValue]="null">-- Select Appointment --</option>
          <option *ngFor="let a of appointments" [ngValue]="a">
            {{a.patient.name}} ({{a.doctor}}) - {{a.dateTime | date:'shortTime'}}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label>Vitals (e.g. BP, Temp)</label>
        <input type="text" [(ngModel)]="vitals" placeholder="BP: 120/80, Temp: 98.6">
      </div>
      <div class="form-group full-width">
        <label>Short Notes</label>
        <textarea [(ngModel)]="notes" rows="3" placeholder="Enter consultation notes..."></textarea>
      </div>
    </div>
    <button class="btn primary" (click)="saveConsultation()">Complete Consultation</button>
  </div>

  <div class="card glass list-card">
    <div class="list-header">
      <h2>Consultation History</h2>
      <div class="search-box">
        <select [(ngModel)]="selectedPatientId" (change)="viewHistory()">
          <option [ngValue]="null">-- Select Patient --</option>
          <option *ngFor="let p of patients" [ngValue]="p.id">{{p.name}}</option>
        </select>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Doctor</th>
          <th>Vitals</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of patientConsultations">
          <td>{{c.appointment.dateTime | date:'mediumDate'}}</td>
          <td>{{c.appointment.doctor}}</td>
          <td>{{c.vitals}}</td>
          <td>{{c.notes}}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
