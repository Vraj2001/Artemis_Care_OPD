<div class="container">
  <div class="card glass">
    <h2>Patient Registration</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Name</label>
        <input type="text" [(ngModel)]="newPatient.name" placeholder="Enter name">
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select [(ngModel)]="newPatient.gender">
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Age</label>
        <input type="number" [(ngModel)]="newPatient.age">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" [(ngModel)]="newPatient.phoneNumber" placeholder="Enter phone">
      </div>
    </div>
    <button class="btn primary" (click)="addPatient()">Register Patient</button>
  </div>

  <div class="card glass list-card">
    <div class="list-header">
      <h2>Patient List</h2>
      <div class="search-box">
        <input type="text" [(ngModel)]="searchQuery" (input)="search()" placeholder="Search by name or phone...">
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Gender</th>
          <th>Age</th>
          <th>Phone</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of patients">
          <td>{{p.name}}</td>
          <td>{{p.gender}}</td>
          <td>{{p.age}}</td>
          <td>{{p.phoneNumber}}</td>
          <td>
            <button class="btn danger sm" (click)="deletePatient(p.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
