<div class="app-layout">

    <div class="logo">
      <h1>Artemis Care</h1>
    </div>
    <ul class="nav-links">
      <li><a routerLink="/patients" routerLinkActive="active" (click)="toggleSidebar()">Patients</a></li>
      <li><a routerLink="/appointments" routerLinkActive="active" (click)="toggleSidebar()">Appointments</a></li>
      <li><a routerLink="/consultations" routerLinkActive="active" (click)="toggleSidebar()">Consultations</a></li>

  </nav>
  <main class="content">

      <button class="hamburger-btn glass" (click)="toggleSidebar()">☰ Menu</button>

    <router-outlet></router-outlet>

</div>
